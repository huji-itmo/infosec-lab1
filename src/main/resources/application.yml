server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/infosec_lab1}
    username: ${SPRING_DATASOURCE_USERNAME:appuser}
    password: ${SPRING_DATASOURCE_PASSWORD:appsecret123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

app:
  jwt:
    secret: ${APP_JWT_SECRET:c2VjdXJlLXNlY3JldC1rZXktZm9yLWluZm9zZWMtbGFiMS1wcm9qZWN0LTIwMjYtand0}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:3600000}
