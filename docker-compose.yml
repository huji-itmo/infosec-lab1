services:
  postgres:
    image: postgres:16-alpine
    container_name: infosec-db
    environment:
      POSTGRES_DB: infosec_lab1
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: appsecret123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d infosec_lab1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: